[project]
name = "attention-for-control-systems"
version = "0.1.0"
description = "Attention mechanisms for control systems"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "torch>=2.7",
    "numpy>=1.21,<2.0",
    "scipy>=1.7,<1.11",
    "hydra-core>=1.3,<2.0",
    "matplotlib>=3.5,<4.0",
    "wandb>=0.15,<1.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true