# @package _global_

transformer_seed: null
data_seed: null

epochs: 5
learning_rate: 1e-3
eval_every: 1

training_batch_size: 256
validation_batch_size: 256
test_batch_size: 256

save_model: True

model:
  description: a transformer architecture

  model_name: transformer # Name of the layer used
  embedding: transformer-positional-encoding # Embedding type
  layer_name: transformer-encoder-layer # Name of the layer used
  out_layer: mlp-classifier-for-kernel-parameters-estimation # Output layer type
  num_layers: 2

  # Layer parameters
  input_dim: 2
  model_dim: 8
  num_heads: 8
  output_dim: ${model.model_dim}
  activation_function: gelu
  dropout: 0.1

  # Only for out_layer = "mlp-classifier" or out_layer = "token-wise-readout"
  input_dim_classifier: "${mul: 2, ${model.output_dim} }" # Input dimension of the classifier = output_dim * 2
  hidden_dim_classifier: "${div: ${model.input_dim_classifier}, 2 }" # Hidden dimension of the classifier = input_dim_classifier/2
  output_dim_classifier: 2 # Output dimension of the classifier = 2
  out_bias1_classifier: True # Biases of classifier hidden layer and out layer
  out_bias2_classifier: True # Biases of classifier hidden layer and out layer

  # Only for out_layer = mean-pooled-classifier
  head_bias: True # Biases of the head layer
  eps: 1e-6 # Epsilon for numerical stability in the head layer

  out_dir_name: "transformer"

dataset:
  name: kernel-parameters-estimation
  description: stable spline kernel generator of the type [ [u, y] , padding] -> [alpha, c]

  shuffle: False # The sequences are already generated randomly

  batches_per_epoch: 1000

  g_length: 2
  n: 100
  n_past: 0
  n_future: "${dataset.n}"
  c_min: 0.0001
  c_max: 1.0
  alpha_min: 0.7
  alpha_max: 0.95
  snr_min: 100
  snr_max: 100
  jitter_regularization_parameter: 0.00001

  padding: 0
  low_pass_cutoff: null
  low_pass_cutoff_order: null

  out_dir_name: "kernel-parameters-estimation"

wandb:
  enable: True
  project: AttentionForControlSystems
  entity: alessioferraretto-unipd
  dataset: kernel-parameters-estimation
  model_name: "transformer"
