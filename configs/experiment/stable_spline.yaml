# @package _global_

seed: null

epochs: 5
learning_rate: 1e-3

training_batch_size: 512
validation_batch_size: 128
test_batch_size: 128

model:
  description: Transformer

  layer_name: transformer # Name of the layer used
  embedding: continuous-signal-projection # Embedding type
  out_layer: mean-pooled-classifier # Output layer type
  num_layers: 1

  # Layer parameters
  input_dim: 2
  model_dim: 8
  num_heads: 1
  output_dim: 8
  activation_function: gelu
  dropout: 0.1

  # Only for out_layer = mlp-classifier
  input_dim_classifier: 128 # Input dimension of the classifier
  hidden_dim_classifier: 32 # Hidden dimension of the classifier
  output_dim_classifier: 32 # Output dimension of the classifier
  out_bias1_classifier: True # Biases of classifier hidden layer and out layer
  out_bias2_classifier: True # Biases of classifier hidden layer and out layer

  # Only for out_layer = mean-pooled-classifier
  head_bias: True # Biases of the head layer
  eps: 1e-6 # Epsilon for numerical stability in the head layer

  out_dir_name: "induction-head"

dataset:
  name: induction-head
  description: TODO

  shuffle: False # The sequences are already generated randomly

  batches_per_epoch: 1000

  g_length: 8
  n_past: 25
  n_future: 25
  c_min: 0.1
  c_max: 1.0
  alpha_min: 0.1
  alpha_max: 1.0
  snr_min: 1.0
  snr_max: 3.0
  jitter_regularization_parameter: 0.01

  out_dir_name: "induction-head"

wandb:
  enable: False
  project: AttentionForControlSystems
  entity: alessio-ferraretto-
  dataset: induction-head
  model_name: "transformer"
