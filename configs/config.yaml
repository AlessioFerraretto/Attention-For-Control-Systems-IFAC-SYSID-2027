project_name: "Attention for Control Systems"

num_workers: 4
# Separate seeds keep synthetic data and transformer initialization independent.
transformer_seed: null
data_seed: null
debug_every: 10

resume_checkpoint: null
inference: false

defaults:
  - _self_
  - experiment: null

hydra:
  run:
    # Override Hydra's working directory. `slurm_job_id` is a custom OmegaConf
    # resolver to provide the JOB id.
    dir: ./outputs/${dataset.out_dir_name}/${model.out_dir_name}/${slurm_job_id:}/

  job_logging:
    handlers:
      file:
        # Rewrite log file, instead of appending
        mode: w
